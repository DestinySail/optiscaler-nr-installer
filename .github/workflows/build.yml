name: build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: ./scripts/test-publish-extras-r2.ps1
      - run: cargo build --release --locked
        env:
          NR_RELEASE_REPO: ${{ github.repository }}
          NR_UPDATE_PUBKEY: ${{ vars.NR_UPDATE_PUBKEY }}
      - uses: actions/upload-artifact@v7
        with:
          name: optiscaler-nr-installer-windows-x64
          path: target/release/OptiScalerNR.exe
